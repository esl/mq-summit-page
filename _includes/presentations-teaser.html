<!-- Short homepage section. The slide tiles themselves are on /presentations.html (see _includes/presentations-2026.html). -->
{% if site.data.presentations_2026 and site.data.presentations_2026.size > 0 %}
<div class="section mqs-pres-home" id="presentations">
  <style>
    .mqs-pres-home{background:#000101;color:#EEEEEE;padding:72px 24px;text-align:center;font-family:'Lato',sans-serif}
    .mqs-pres-home .mqs-pres-home-inner{width:100%;max-width:1240px;margin:0 auto}
    .mqs-pres-home h2{font-family:'Montserrat',sans-serif;font-weight:600;font-size:32px;letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF;margin:0}
    .mqs-pres-home .mqs-pres-home-divider{width:80px;height:5px;margin:22px auto 28px;background:linear-gradient(to right,#80C0FA 50%,#C8A465 50%)}
    .mqs-pres-home p{font-size:17px;line-height:26px;color:#B9B4C7;max-width:640px;margin:0 auto}
    .mqs-pres-home .mqs-pres-home-btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;background:#C8A465;color:#10202F;text-decoration:none;border-radius:10px;padding:14px 26px;margin-top:36px;min-height:44px}
    .mqs-pres-home .mqs-pres-home-btn:hover{background:#D6B67D;color:#10202F;text-decoration:none}
    .mqs-pres-home .mqs-pres-home-btn:focus-visible{outline:3px solid #80C0FA;outline-offset:2px}
    @media (max-width:640px){.mqs-pres-home{padding:56px 16px}.mqs-pres-home h2{font-size:26px}}
  </style>
  <div class="mqs-pres-home-inner">
    <h2>Presentations from 2026</h2>
    <div class="mqs-pres-home-divider" aria-hidden="true"></div>
    <p>Download the slides shared by MQ Summit 2026 speakers.</p>
    <a class="mqs-pres-home-btn" href="{{ '/presentations.html' | relative_url }}">See presentations</a>
  </div>
</div>
{% endif %}
