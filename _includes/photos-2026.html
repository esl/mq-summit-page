<!-- Photos from 2026. Images are listed in _data/photos_2026.yml; the section stays hidden while the list is empty. -->
{% if site.data.photos_2026 and site.data.photos_2026.size > 0 %}
<div class="section mqs-pho" id="photos-2026">
  <style>
    .mqs-pho{background:#000101;color:#EEEEEE;padding:72px 24px;text-align:center;font-family:'Lato',sans-serif}
    .mqs-pho .mqs-pho-inner{width:100%;max-width:1240px;margin:0 auto}
    .mqs-pho h2{font-family:'Montserrat',sans-serif;font-weight:600;font-size:32px;letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF;margin:0}
    .mqs-pho .mqs-pho-divider{width:80px;height:5px;margin:22px auto 36px;background:linear-gradient(to right,#80C0FA 50%,#C8A465 50%)}
    .mqs-pho .mqs-pho-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;max-width:1240px;margin:0 auto}
    .mqs-pho .mqs-pho-grid a{display:block;aspect-ratio:3/2;overflow:hidden;border-radius:8px;background:#1C1830}
    .mqs-pho .mqs-pho-grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
    .mqs-pho .mqs-pho-grid a:hover img{transform:scale(1.04)}
    .mqs-pho .mqs-pho-grid a:focus-visible{outline:3px solid #80C0FA;outline-offset:2px}
    .mqs-pho .mqs-pho-credit{font-size:15px;line-height:22px;color:#B9B4C7;margin:18px 0 0}
    .mqs-pho .mqs-pho-credit a{color:#1E90FF;text-decoration:underline}
    .mqs-pho .mqs-pho-all{display:inline-flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;background:#C8A465;color:#10202F;text-decoration:none;border-radius:10px;padding:14px 26px;margin-top:36px;min-height:44px}
    .mqs-pho .mqs-pho-all:hover{background:#D6B67D;color:#10202F;text-decoration:none}
  </style>
  <div class="mqs-pho-inner">
  <h2>Photos from 2026</h2>
  <div class="mqs-pho-divider" aria-hidden="true"></div>
  <div class="mqs-pho-grid">
    {% for image in site.data.photos_2026 %}
    <a data-fslightbox="photos-2026" href="{{ image.src | relative_url }}"><img src="{{ image.thumb | default: image.src | relative_url }}" alt="{{ image.alt | escape }}" loading="lazy"></a>
    {% endfor %}
  </div>
  <p class="mqs-pho-credit">Photos by <a href="https://pl.linkedin.com/in/fotografpiotrkruszak" target="_blank" rel="noopener">Piotr Kruszak</a>. <a href="https://pierrestudiolight.myportfolio.com/" target="_blank" rel="noopener">See more of his work</a>.</p>
  <a class="mqs-pho-all" href="https://piotr846.pixieset.com/mqsummitandcodebeameurope2122october2026/" target="_blank" rel="noopener">See all photos</a>
  </div>
</div>
{% endif %}
