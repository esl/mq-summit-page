<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQ Summit 2026 - Presentations & Slides</title>
  <style>
    :root {
      --bg: #0b0d13;
      --card-bg: #151922;
      --card-hover: #1c2230;
      --border: #232936;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --badge-bg: rgba(99, 102, 241, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 0 20px 80px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--accent);
      background-color: rgba(99, 102, 241, 0.08);
    }

    .brand {
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hero {
      max-width: 800px;
      margin: 50px auto 35px;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.15rem;
      margin-bottom: 30px;
    }

    .search-wrapper {
      max-width: 500px;
      margin: 0 auto 50px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 1rem;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: #6b7280;
    }
